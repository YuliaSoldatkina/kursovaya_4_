{% extends 'mailings/base.html' %}

{% block content %}
<h1>Удаление клиента</h1>
<p>Вы уверены, что хотите удалить клиента «{{ recipient.full_name }}»?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a class="btn" href="{% url 'mailings:recipient_list' %}">Отмена</a>
</form>
{% endblock %}
