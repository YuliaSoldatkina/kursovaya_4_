{% extends 'mailings/base.html' %}

{% block content %}
<h1>Удаление сообщения</h1>
<p>Вы уверены, что хотите удалить сообщение «{{ message.subject }}»?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a class="btn" href="{% url 'mailings:message_list' %}">Отмена</a>
</form>
{% endblock %}
