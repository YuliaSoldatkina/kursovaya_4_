{% extends 'mailings/base.html' %}

{% block content %}
<h1>{% if recipient %}Редактирование клиента{% else %}Добавление клиента{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
    <a class="btn" href="{% url 'mailings:recipient_list' %}">Отмена</a>
</form>
{% endblock %}
