<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сервис рассылок</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6fa;
            color: #333;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 15px 30px;
        }
        header a {
            color: #fff;
            text-decoration: none;
            margin-right: 20px;
        }
        main {
            padding: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .btn {
            display: inline-block;
            padding: 8px 14px;
            background: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            margin: 3px;
        }
        .btn-danger {
            background: #e74c3c;
        }
        form {
            background: #fff;
            padding: 20px;
            max-width: 500px;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<header>
    <a href="{% url 'mailings:home' %}">Главная</a>
    <a href="{% url 'mailings:recipient_list' %}">Клиенты</a>
    <a href="{% url 'mailings:message_list' %}">Сообщения</a>
    <a href="{% url 'mailings:mailing_list' %}">Рассылки</a>

    {% if user.is_authenticated %}
        <span>Вы вошли как: {{ user.username }}</span>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Выйти</button>
        </form>
    {% else %}
        <a href="{% url 'accounts:login' %}">Войти</a>
        <a href="{% url 'accounts:signup' %}">Регистрация</a>
    {% endif %}
</header>

<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
