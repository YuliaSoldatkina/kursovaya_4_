{% extends 'mailings/base.html' %}

{% block content %}
<h1>{% if mailing %}Редактирование рассылки{% else %}Добавление рассылки{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
    <a class="btn" href="{% url 'mailings:mailing_list' %}">Отмена</a>
</form>
{% endblock %}
