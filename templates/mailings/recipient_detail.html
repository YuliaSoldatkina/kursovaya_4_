{% extends 'mailings/base.html' %}

{% block content %}
<h1>{{ recipient.full_name }}</h1>
<p><strong>Email:</strong> {{ recipient.email }}</p>
<p><strong>Комментарий:</strong> {{ recipient.comment }}</p>

<a class="btn" href="{% url 'mailings:recipient_update' recipient.pk %}">Редактировать</a>
<a class="btn btn-danger" href="{% url 'mailings:recipient_delete' recipient.pk %}">Удалить</a>
<a class="btn" href="{% url 'mailings:recipient_list' %}">Назад</a>
{% endblock %}
