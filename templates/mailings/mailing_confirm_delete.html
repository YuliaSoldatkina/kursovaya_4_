{% extends 'mailings/base.html' %}

{% block content %}
<h1>Удаление рассылки</h1>
<p>Вы уверены, что хотите удалить рассылку №{{ mailing.pk }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a class="btn" href="{% url 'mailings:mailing_list' %}">Отмена</a>
</form>
{% endblock %}
